# =============================================================================
# JobSense — Docker Compose Override (Development hot-reload)
#
# This file is automatically merged with docker-compose.yml when you run
# `docker-compose up`. It adds volume mounts and hot-reload for local dev.
# =============================================================================

services:
  # ─── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: jobsense
      POSTGRES_PASSWORD: jobsense
      POSTGRES_DB: jobsense

  # ─── Redis ──────────────────────────────────────────────────────────────────
  redis:
    ports:
      - "127.0.0.1:6379:6379"

  # ─── FastAPI Backend (hot-reload via uvicorn --reload) ───────────────────────
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    volumes:
      # Mount source code so changes are reflected without rebuild
      - ./apps/api:/app
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql://jobsense:jobsense@postgres:5432/jobsense
      REDIS_URL: redis://redis:6379/0
      LOG_LEVEL: DEBUG
    command: >
      uvicorn main:app
        --host 0.0.0.0
        --port 8000
        --reload
        --reload-dir /app
        --log-level debug
    ports:
      - "127.0.0.1:8000:8000"

  # ─── Celery Worker (restart the container after code changes) ────────────────
  worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    volumes:
      - ./apps/api:/app
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql://jobsense:jobsense@postgres:5432/jobsense
      REDIS_URL: redis://redis:6379/0
      LOG_LEVEL: DEBUG
    command: >
      celery -A app.tasks.celery_app worker
        --loglevel=debug
        --concurrency=2
        -Q ingestion,matching,ai,email,calendar,default

  # ─── Celery Beat (Scheduler) ─────────────────────────────────────────────────
  beat:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    volumes:
      - ./apps/api:/app
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql://jobsense:jobsense@postgres:5432/jobsense
      REDIS_URL: redis://redis:6379/0
    command: celery -A app.tasks.celery_app beat --loglevel=info

  # ─── Flower (Celery monitoring UI) ───────────────────────────────────────────
  flower:
    ports:
      - "127.0.0.1:5555:5555"
